<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>


    
    <link rel="stylesheet" href="style.css">


   
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


   
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


   

    <nav>

        <div class="div1">
            <a href="index.html" style="color:white; text-decoration:none;"></a>

            <img
                src="./imgs/home.jpeg"
                alt="Meal Finder">

            <h1 class="heading1">MEAL FINDER</h1>

        </div>


        <div class="div2">

            <!-- HAMBURGER BUTTON -->

            <button
                class="menu-btn"type="button"data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"aria-controls="offcanvasRight">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </nav>



    <!--  OFFCANVAS  -->

    <div
        class="offcanvas offcanvas-end" 
        tabindex="-1" id="offcanvasRight" 
        aria-labelledby="offcanvasRightLabel">


        <!-- OFFCANVAS HEADER -->

        <div class="offcanvas-header">

            <h5
                class="offcanvas-title"
                id="offcanvasRightLabel">

                

            </h5>


            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close">
            </button>

        </div>



        <!-- OFFCANVAS BODY -->

        <div class="offcanvas-body">

            <div id="categories">

                Loading...

            </div>

        </div>

    </div>



    <!-- HERO  -->

    <section class="hero">

        <div class="div3">


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="search"
                    placeholder="Search recipes here..." id="search">


            
                    <a href="" id="search-Btn">
                    <i class="fa-solid fa-magnifying-glass"></i></a>

                

            </div>




            <h1>
                What are your favorite cuisines?
            </h1>


            <p>
                PERSONALIZE YOUR EXPERIENCE
            </p>


        </div>

    </section>
    <br>
    <br>

    <div class="mealTitle"></div>
    

    <div id="mealCards">

    </div>

    <!-- CATEGORIES  -->

    <section class="category-section">


        <div class="category-container">


            <h2>
                CATEGORIES
            </h2>


            <div class="orange-line"></div>


            <!-- API CARDS -->

            <div
                id="categoryCards"
                class="category-grid">

                Loading...

            </div>


        </div>

    </section>




    <!-- BOOTSTRAP JS  -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- YOUR JS -->

    <script src="script.js"></script>


</body>

</html>
